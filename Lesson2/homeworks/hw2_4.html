<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Fjalla+One&family=Indie+Flower&family=Rubik+Pixels&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
    <style>
        .rubik-pixels-regular {
            font-family: "Rubik Pixels", system-ui;
            font-weight: 400;
            font-style: normal;
        }
        .sedgwick-ave-display-regular {
            font-family: "Sedgwick Ave Display", cursive;
            font-weight: 400;
            font-style: normal;
        }
        .dancing-script-400 {
                             font-family: "Dancing Script", cursive;
                             font-optical-sizing: auto;
                             font-weight:400;
                             font-style: normal;
                         }
        .fjalla-one-regular {
            font-family: "Fjalla One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        .indie-flower-regular {
            font-family: "Indie Flower", cursive;
            font-weight: 400;
            font-style: normal;
        }
        p{
            width: 180px;
            height: 180px;
            background-color: peachpuff;
            display: inline-block;
            text-align: center;
            line-height: 180px;
            margin: 20px;
        }



    </style>
</head>
<body>
<p class="rubik-pixels-regular">Rubik Pixeles</p>
<p class="sedgwick-ave-display-regular">Sedgwick Ave Display</p>
<p class="dancing-script-400">Dancing Script</p>
<p class="fjalla-one-regular">Fjalla One</p>
<p class="indie-flower-regular">Indie Flower</p>

</body>
</html>
